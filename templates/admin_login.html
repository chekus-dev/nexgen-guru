{{ define "admin_content" }}
<div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-2xl p-10">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-brand-primary rounded-2xl mx-auto flex items-center justify-center text-white font-extrabold text-2xl mb-4">NG</div>
            <h1 class="text-2xl font-extrabold text-gray-900">Admin Portal</h1>
            <p class="text-gray-500 text-sm mt-1">NexGen Guru Consulting</p>
        </div>

        {{ if .Error }}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm font-semibold">
            {{ .Error }}
        </div>
        {{ end }}

        <form action="/admin/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required autofocus
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-primary outline-none transition-all">
            </div>
            <button type="submit" class="w-full py-4 rounded-xl text-base font-bold text-white bg-brand-primary hover:bg-indigo-700 transition-all shadow-lg">
                Login
            </button>
        </form>
    </div>
    <p class="text-center text-gray-500 text-xs mt-6">© 2025 NexGen Guru Consulting</p>
</div>
{{ end }}
