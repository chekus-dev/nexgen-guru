{{ define "content" }}
<section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-24">
    <a href="/blog" class="text-brand-primary font-bold hover:underline mb-8 inline-block">&larr; Back to Blog</a>
    
    <article class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100">
        <header class="mb-8 border-b border-gray-100 pb-8">
            <time class="text-sm font-bold text-brand-secondary mb-2 block">{{ .Post.Date.Format "January 02, 2006" }}</time>
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 leading-tight">{{ .Post.Title }}</h1>
        </header>
        
        <div class="prose prose-lg text-gray-600 max-w-none">
            <!-- If your Post.Body is HTML, use the safeHTML function, otherwise just use the variable -->
            {{ .Post.Body }}
        </div>
    </article>
</section>
{{ end }}
