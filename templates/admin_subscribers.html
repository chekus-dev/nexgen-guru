{{ define "admin_content" }}
<div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-900">Subscribers</h1>
    <p class="text-gray-500 mt-1">All newsletter subscribers.</p>
</div>

{{ if .DBError }}
<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 font-semibold">
    {{ .DBError }}
</div>
{{ end }}

<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-100">
                <tr>
                    <th class="px-6 py-4 text-left font-bold text-gray-600 text-xs uppercase tracking-wider">Email</th>
                    <th class="px-6 py-4 text-left font-bold text-gray-600 text-xs uppercase tracking-wider">Subscribed</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {{ range .Subscribers }}
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-semibold text-gray-900">{{ .Email }}</td>
                    <td class="px-6 py-4 text-gray-500">{{ .CreatedAt.Format "Jan 02, 2006" }}</td>
                </tr>
                {{ else }}
                <tr><td colspan="2" class="px-6 py-12 text-center text-gray-500">No subscribers yet.</td></tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
